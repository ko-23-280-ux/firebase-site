<!DOCTYPE html>
<html>
<head>
  <title>Monitor</title>
</head>
<body>

<h2>Profiles</h2>
<div id="list"></div>

<button onclick="setOnline()">Online</button>
<button onclick="setOffline()">Offline</button>

<!-- ✅ ВАЖНО: НЕ module -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "https://qbcmxrutwcavdrbrufsr.supabase.co";
const supabaseKey = "sb_publishable_8nUWEgvFkN9MDJwRHknJmw_gugf2qbP";

const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

const list = document.getElementById("list");

let me = null;

// загрузка
async function loadUsers() {
  const { data } = await supabaseClient.from("profiles").select("*");

  list.innerHTML = data.map(u =>
    `<p>${u.username} - ${u.status}</p>`
  ).join("");
}

// взять первого пользователя
async function getMe() {
  const { data } = await supabaseClient.from("profiles").select("*").limit(1);
  me = data[0];
}

// online
async function setOnline() {
  if (!me) await getMe();

  await supabaseClient
    .from("profiles")
    .update({ status: "online" })
    .eq("id", me.id);

  loadUsers();
}

// offline
async function setOffline() {
  if (!me) await getMe();

  await supabaseClient
    .from("profiles")
    .update({ status: "offline" })
    .eq("id", me.id);

  loadUsers();
}

// realtime
supabaseClient
  .channel("profiles")
  .on("postgres_changes",
    { event: "*", schema: "public", table: "profiles" },
    () => loadUsers()
  )
  .subscribe();

getMe();
loadUsers();

</script>

</body>
</html>

</body>
</html>

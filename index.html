<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Status Monitor</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    h2 {
      color: #38bdf8;
    }

    .user {
      background: #1e293b;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
    }

    .online {
      color: #22c55e;
      font-weight: bold;
    }

    .offline {
      color: #ef4444;
      font-weight: bold;
    }

    button {
      margin-top: 20px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>👥 Users Monitor</h2>
<div id="list"></div>

<button onclick="setOnline()">🟢 Set Online</button>
<button onclick="setOffline()">🔴 Set Offline</button>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// 🔑 ТВОИ ДАННЫЕ
const supabaseUrl = "https://qbcmxrutwcavdrbrufsr.supabase.co";
const supabaseKey = "sb_publishable_8nUWEgvFkN9MDJwRHknJmw_gugf2qbP";

const supabase = createClient(supabaseUrl, supabaseKey);

const list = document.getElementById("list");

// 📥 загрузка пользователей
async function loadUsers() {
  const { data, error } = await supabase.from("profiles").select("*");

  if (error) {
    console.log(error);
    return;
  }

  list.innerHTML = data.map(u => `
    <div class="user">
      <span>${u.username}</span>
      <span class="${u.status === 'online' ? 'online' : 'offline'}">
        ${u.status}
      </span>
    </div>
  `).join("");
}

loadUsers();

// ⚡ realtime
supabase
  .channel("profiles-channel")
  .on(
    "postgres_changes",
    {
      event: "*",
      schema: "public",
      table: "profiles"
    },
    () => {
      loadUsers();
    }
  )
  .subscribe();

// 🟢 сделать себя online
window.setOnline = async function () {
  await supabase
    .from("profiles")
    .update({ status: "online" })
    .eq("username", "me"); // поменяй на своё имя
};

// 🔴 сделать offline
window.setOffline = async function () {
  await supabase
    .from("profiles")
    .update({ status: "offline" })
    .eq("username", "me"); // поменяй на своё имя
};

</script>

</body>
</html>

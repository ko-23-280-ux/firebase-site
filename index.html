<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Firebase Status App</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }
    .user {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
    }
    button {
      margin-top: 5px;
      padding: 5px 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>📊 Монитор статусов</h2>
<div id="users"></div>

<script type="module">

  // Firebase SDK
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // 🔥 ТВОЙ FIREBASE CONFIG (вставлен)
  const firebaseConfig = {
    apiKey: "AIzaSyCbF9n2JCOBHF_3WcrY6OUWIvirmREFkpo",
    authDomain: "status-app-f2c66.firebaseapp.com",
    projectId: "status-app-f2c66",
    storageBucket: "status-app-f2c66.firebasestorage.app",
    messagingSenderId: "769407930761",
    appId: "1:769407930761:web:5f37bf7f2fdf1709cb5158",
    measurementId: "G-YSCQFZ6LN8"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const usersDiv = document.getElementById("users");

  // 📥 загрузка пользователей
  async function loadUsers() {
    const snapshot = await getDocs(collection(db, "profiles"));

    usersDiv.innerHTML = "";

    snapshot.forEach((d) => {
      const user = d.data();

      const div = document.createElement("div");
      div.className = "user";

      div.innerHTML = `
        <b>Имя:</b> ${user.username}<br>
        <b>Статус:</b> ${user.status}<br>

        <button onclick="setStatus('${d.id}','online')">Online</button>
        <button onclick="setStatus('${d.id}','offline')">Offline</button>
        <button onclick="setStatus('${d.id}','busy')">Busy</button>
      `;

      usersDiv.appendChild(div);
    });
  }

  // ✏️ обновление статуса
  async function setStatus(id, status) {
    const ref = doc(db, "profiles", id);
    await updateDoc(ref, { status });
  }

  window.setStatus = setStatus;

  // 🔄 реальное время
  onSnapshot(collection(db, "profiles"), () => {
    loadUsers();
  });

  loadUsers();

</script>

</body>
</html>

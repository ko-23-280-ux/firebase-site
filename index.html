<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Монитор статусов</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .user {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
    }
    button {
      margin-top: 5px;
      padding: 5px 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>📊 Монитор статусов</h2>

<div id="users"></div>

<script>
  // 🔑 ВСТАВЬ СЮДА СВОИ ДАННЫЕ
  const supabaseUrl = 'https://qbcmxrutwcavdrbrufsr.supabase.co';
  const supabaseKey = const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFiY214cnV0d2NhdmRyYnJ1ZnNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwMDA5MjMsImV4cCI6MjA5MDU3NjkyM30.qjqpPjvZAr8bDGb7eKJHm5lnwFkL6rz0_7VWIuK6Me0';

  const client = supabase.createClient(supabaseUrl, supabaseKey);

  const usersDiv = document.getElementById('users');

  // 📥 Получение пользователей
  async function loadUsers() {
    const { data, error } = await client
      .from('profiles')
      .select('*');

    if (error) {
      console.error('Ошибка загрузки:', error);
      return;
    }

    usersDiv.innerHTML = '';

    data.forEach(user => {
      const div = document.createElement('div');
      div.className = 'user';

      div.innerHTML = `
        <b>Имя:</b> ${user.username} <br>
        <b>Статус:</b> <span id="status-${user.id}">${user.status}</span><br>

        <button onclick="setStatus('${user.id}', 'online')">Online</button>
        <button onclick="setStatus('${user.id}', 'offline')">Offline</button>
        <button onclick="setStatus('${user.id}', 'busy')">Busy</button>
      `;

      usersDiv.appendChild(div);
    });
  }

  // ✏️ Обновление статуса
  async function setStatus(id, status) {
    const { error } = await client
      .from('profiles')
      .update({ status: status })
      .eq('id', id);

    if (error) {
      console.error('Ошибка обновления:', error);
    } else {
      loadUsers();
    }
  }

  // 🔄 Реальное время
  client
    .channel('profiles-changes')
    .on(
      'postgres_changes',
      { event: '*', schema: 'public', table: 'profiles' },
      payload => {
        console.log('Изменение:', payload);
        loadUsers();
      }
    )
    .subscribe();

  // 🚀 Старт
  loadUsers();
</script>

</body>
</html>
